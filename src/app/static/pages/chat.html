<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Chat — Tutor</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gradient-to-b from-[#0a0f1e] to-[#0d1323] text-white h-screen flex flex-col overflow-hidden">
  <nav class="flex-shrink-0 border-b border-white/10 px-6 py-4 flex items-center justify-between">
    <a href="/" class="font-semibold text-lg tracking-tight text-white">Tutor</a>
    <a href="/" class="text-sm text-slate-400 hover:text-white transition-colors">Dashboard</a>
  </nav>
  <main class="flex-1 flex min-h-0 w-full overflow-hidden">
    <!-- Chat panel -->
    <div class="flex-1 flex flex-col min-h-0 border-r border-white/10">
      <div id="chat-messages" class="flex-1 overflow-y-auto py-6 px-6 space-y-4 min-h-0 max-w-3xl w-full mx-auto"></div>
      <div id="typing-indicator" class="hidden px-6 py-2 max-w-3xl w-full mx-auto">
        <div class="flex gap-1 items-center">
          <span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0ms;"></span>
          <span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 150ms;"></span>
          <span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 300ms;"></span>
        </div>
      </div>
      <div class="flex-shrink-0 border-t border-white/10 p-4 px-6">
        <form id="chat-form" class="flex gap-3 max-w-3xl mx-auto">
          <textarea id="chat-input" rows="1" class="flex-1 bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 resize-none" placeholder="Type your message..."></textarea>
          <button type="submit" id="send-btn" class="px-5 py-3 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded-lg transition-colors disabled:opacity-50">Send</button>
        </form>
      </div>
    </div>
    <!-- Outline panel: shown when outline is ready -->
    <div id="outline-panel" class="hidden w-80 flex-shrink-0 flex flex-col overflow-hidden">
      <div id="outline-section" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
    </div>
  </main>
  <script type="module" src="/static/js/chat.js"></script>
</body>
</html>
