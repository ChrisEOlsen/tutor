<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Chat — Tutor</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gradient-to-b from-[#0a0f1e] to-[#0d1323] text-white min-h-screen flex flex-col">
  <nav class="border-b border-white/10 px-6 py-4 flex items-center justify-between">
    <a href="/" class="font-semibold text-lg tracking-tight text-white">Tutor</a>
    <a href="/" class="text-sm text-slate-400 hover:text-white transition-colors">Dashboard</a>
  </nav>
  <main class="flex-1 flex flex-col max-w-3xl mx-auto w-full px-6">
    <div id="chat-messages" class="flex-1 overflow-y-auto py-6 space-y-4"></div>
    <div id="typing-indicator" class="hidden px-4 py-2">
      <div class="flex gap-1 items-center">
        <span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0ms;"></span>
        <span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 150ms;"></span>
        <span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 300ms;"></span>
      </div>
    </div>
    <div id="outline-section" class="hidden px-4 py-4 space-y-4"></div>
    <div class="border-t border-white/10 p-4">
      <form id="chat-form" class="flex gap-3">
        <textarea id="chat-input" rows="1" class="flex-1 bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 resize-none" placeholder="Type your message..."></textarea>
        <button type="submit" id="send-btn" class="px-5 py-3 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded-lg transition-colors disabled:opacity-50">Send</button>
      </form>
    </div>
  </main>
  <footer class="border-t border-white/10 px-6 py-4 text-xs text-slate-500">
    AI-Powered Learning
  </footer>
  <script type="module" src="/static/js/chat.js"></script>
</body>
</html>
